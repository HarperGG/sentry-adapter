<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teambition 接口连通性检查</title>
  <link rel="stylesheet" href="swagger-ui.css">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f7f9fc; }
    .notice { max-width: 1120px; margin: 28px auto 4px; padding: 0 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #19314d; }
    .notice h1 { margin: 0 0 10px; font-size: 24px; }
    .notice p { margin: 0 0 8px; line-height: 1.6; }
    .notice strong { color: #a33b00; }
    .notice code { background: #e8eef6; padding: 2px 5px; border-radius: 4px; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 22px 0; }
  </style>
</head>
<body>
  <div class="notice">
    <h1>Teambition 接口连通性检查</h1>
    <p><strong>只读检查，不会创建任务。</strong>先执行 Token 检查；若成功，再用一个已存在的任务 ID 执行任务读取检查。</p>
    <p>密钥从服务端的环境变量读取。浏览器只显示脱敏状态，不显示 AppSecret、appToken 或任务正文。</p>
  </div>
  <div id="swagger-ui"></div>
  <script src="swagger-ui-bundle.js"></script>
  <script>
    window.addEventListener("load", function () {
      SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis],
        layout: "BaseLayout",
        docExpansion: "list",
        defaultModelsExpandDepth: -1,
        displayRequestDuration: true,
        tryItOutEnabled: true,
        validatorUrl: null,
        supportedSubmitMethods: ["post"]
      });
    });
  </script>
</body>
</html>
