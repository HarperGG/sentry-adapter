services:
  teambition-probe:
    build:
      context: .
      target: teambition-probe
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn}
    env_file:
      - ./.env
      - ./config/credentials.env
    command:
      - -env-file
      - /dev/null
      - -credentials-file
      - /dev/null
      - -once
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
